name: Prepare company logo assets
on:
  push:
    paths:
      - .github/workflows/prepare-company-logos.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch high-resolution brand references
        shell: python
        run: |
          import concurrent.futures, io, json, urllib.request, zipfile
          from pathlib import Path
          out=Path('references');out.mkdir()
          urls={
            'official-hero.png':'https://umabelezadefuturo.grupoboticario.com.br/hero-banner.png',
            'official-careers-banner.png':'https://attachments.gupy.io/production/companies/295/career/210/images/2026-06-19_20-34_bannerUrl.png',
            'vector-reference.zip':'https://vectorseek.com/wp-content/uploads/2023/11/Grupo-Boticario-Logo-Vector.zip',
          }
          def get(item):
            name,url=item
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as r: data=r.read(15_000_000)
              (out/name).write_bytes(data)
              if name.endswith('.zip'):
                with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for info in archive.infolist():
                    if info.file_size<8_000_000 and info.filename.lower().endswith(('.svg','.png')):
                      (out/Path(info.filename).name).write_bytes(archive.read(info))
              print('SUCCESS',name,len(data))
            except Exception as e: print('FAILED',name,str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: list(pool.map(get,urls.items()))
          (out/'sources.json').write_text(json.dumps(urls,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: boticario-sharp-references
          path: references/
          retention-days: 1

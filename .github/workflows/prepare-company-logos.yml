name: Prepare company logo assets
on:
  push:
    paths:
      - .github/workflows/prepare-company-logos.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public brand asset sources
        shell: python
        run: |
          import concurrent.futures, html, json, re, urllib.request
          sites = {
            'fiap': 'https://www.fiap.com.br/',
            'b3': 'https://www.b3.com.br/pt_br/',
            'bv': 'https://www.bv.com.br/',
            'porto': 'https://www.portoseguro.com.br/',
            'pwc': 'https://www.pwc.com.br/',
            'goias': 'https://goias.gov.br/',
            'hsbc': 'https://www.hsbc.com/',
            'bradesco': 'https://banco.bradesco/html/classic/index.shtm',
            'vortx': 'https://www.vortx.com.br/',
            'itau': 'https://www.itau.com.br/',
            'boticario': 'https://www.grupoboticario.com.br/',
          }
          def inspect(item):
            name, url = item
            try:
              request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                text = response.read(8_000_000).decode('utf-8', 'replace')
              candidates = re.findall(r'(?:src|href|data-src)=[\"\']([^\"\']+)[\"\']', text)
              images = [html.unescape(u) for u in candidates if re.search(r'(logo|marca|brand|brasao)', u, re.I) and re.search(r'\.(svg|png|webp|jpg|jpeg)(\?|$)', u, re.I)]
              inline = re.findall(r'<svg\b[\s\S]*?</svg>', text, re.I)
              return name, {'url': url, 'images': list(dict.fromkeys(images))[:25], 'inline_logos': [s[:20000] for s in inline if re.search(r'(logo|marca|brand)', s, re.I)][:3]}
            except Exception as error:
              return name, {'url': url, 'error': str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for name, result in pool.map(inspect, sites.items()):
              print('\nBRAND_SOURCE ' + name + '\n' + json.dumps(result, ensure_ascii=False))
